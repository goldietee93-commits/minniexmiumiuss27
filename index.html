้ำตาลของกระเป๋า Miu Miu ขณะเดินเข้างานวันนี้", "ชายเดรส Miu Miu ของ MINNIE โผล่จากใต้เสื้อแค่นิดเดียว แต่เป็นดีเทลที่ทำให้ทั้งลุคดูลงตัว", "ความมั่นใจในท่าโบกมือของ MINNIE ให้ฝูงชนหน้างานบอกได้เลยว่าเธอสนุกกับโมเมนต์นี้เต็มที่"]}}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('comment-data').textContent);

  // Tag block per platform. X also depends on category (Airport vs General/Main Show).
  function getTagBlock(cat, platform){
    if(platform === 'x'){
      if(cat === 'airport'){
        return "MINNIE TO MIUMIU PFW\n#MIUMIUxMINNIE\n#MiuMiu #MINNIE #PFW #MiuMiuSS27";
      }
      return "MINNIE SHINES AT PFW\n#MiuMiuSS27xMINNIE\n#MiuMiu #MINNIE #PFW #MiuMiuSS27";
    }
    if(platform === 'ig_post' || platform === 'ig_story'){
      return "#MINNIE #MiuMiu #MiuMiuSS27 #PFW\n@min.nicha @miumiu";
    }
    if(platform === 'tiktok'){
      return "#MINNIE #MiuMiu #MiuMiuSS27 #PFW\n@minicha1023 @miumiu";
    }
    // facebook
    return "#MINNIE #MiuMiu #MiuMiuSS27 #PFW @miumiu";
  }

  var CAT_LABELS = {
    airport:"Airport",
    general:"General",
    mainshow:"Main Show"
  };

  var state = { platform:'ig_post', lang:'en', cat:'mainshow' };

  // Shuffle bags: every line in a pool is shown once before any line repeats,
  // instead of picking purely at random (which can resurface the same line
  // after only a handful of draws, well before you've seen the full pool).
  var bags = {};
  var lastShown = {};

  function poolKey(){ return state.lang + ':' + state.cat; }

  function shuffledIndices(n){
    var idxs = [];
    for(var i = 0; i < n; i++) idxs.push(i);
    for(var i = idxs.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = idxs[i]; idxs[i] = idxs[j]; idxs[j] = tmp;
    }
    return idxs;
  }

  function pickComment(){
    var pool = DATA[state.lang][state.cat];
    var key = poolKey();
    if(!bags[key] || bags[key].length === 0){
      var idxs = shuffledIndices(pool.length);
      // avoid the new cycle starting on the same line the old cycle ended on
      if(idxs.length > 1 && idxs[idxs.length - 1] === lastShown[key]){
        var swapAt = Math.floor(Math.random() * (idxs.length - 1));
        var tmp = idxs[idxs.length - 1];
        idxs[idxs.length - 1] = idxs[swapAt];
        idxs[swapAt] = tmp;
      }
      bags[key] = idxs;
    }
    var idx = bags[key].pop();
    lastShown[key] = idx;
    return pool[idx];
  }

  function tagBlock(){
    return getTagBlock(state.cat, state.platform);
  }

  function render(newComment){
    var textEl = document.getElementById('comment-text');
    if(newComment){
      textEl.textContent = pickComment();
    }
    textEl.setAttribute('lang', state.lang);

    document.getElementById('meta-cat').innerHTML = '<b>' + CAT_LABELS[state.cat] + '</b>';
    document.getElementById('meta-lang').textContent = state.lang === 'en' ? 'EN' : 'TH · ไทย';

    var tagsEl = document.getElementById('tags');
    tagsEl.className = 'tag-block';
    tagsEl.textContent = getTagBlock(state.cat, state.platform);

    var pool = DATA[state.lang][state.cat];
    document.getElementById('pool-note').innerHTML =
      '<b>' + pool.length + '</b> ' + (state.lang === 'en' ? 'English' : 'Thai') +
      ' comments in rotation for ' + CAT_LABELS[state.cat] + '.';

    resetCopyLabels();
  }

  function resetCopyLabels(){
    var p = document.getElementById('btn-copy-plain');
    var f = document.getElementById('btn-copy-tags');
    p.classList.remove('copied'); p.textContent = 'Copy comment';
    f.classList.remove('copied'); f.textContent = 'Copy comment + tags';
  }

  document.getElementById('platform-seg').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.platform = btn.dataset.platform;
    render(false);
  });

  document.getElementById('lang-seg').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.lang = btn.dataset.lang;
    render(true);
  });

  document.getElementById('category-nav').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    render(true);
  });

  document.getElementById('btn-generate').addEventListener('click', function(){
    render(true);
  });

  function doCopy(text, btn, label){
    function marked(){
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(function(){
        btn.textContent = label;
        btn.classList.remove('copied');
      }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(marked, function(){
        fallbackCopy(text, marked);
      });
    } else {
      fallbackCopy(text, marked);
    }
  }

  document.getElementById('btn-copy-plain').addEventListener('click', function(){
    var textEl = document.getElementById('comment-text');
    doCopy(textEl.textContent, this, 'Copy comment');
  });

  document.getElementById('btn-copy-tags').addEventListener('click', function(){
    var textEl = document.getElementById('comment-text');
    var text = textEl.textContent + '\n\n' + tagBlock();
    doCopy(text, this, 'Copy comment + tags');
  });

  function fallbackCopy(text, cb){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(cb) cb();
  }

  render(true);
})();
</script>
